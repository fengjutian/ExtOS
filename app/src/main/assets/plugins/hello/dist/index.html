<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello ExtOS</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101116; color: #f4f2ff; }
    main { width: min(34rem, calc(100% - 3rem)); }
    small { color: #aaa5bd; }
    button { margin-top: 1.5rem; border: 0; border-radius: 999px; padding: .8rem 1.2rem; color: white; background: #7c5cfc; font: inherit; }
  </style>
</head>
<body>
  <main>
    <small>Bundled plugin</small>
    <h1>Hello from ExtOS</h1>
    <p id="runtime">Connecting to the host runtime…</p>
    <button id="toast">Call ui.toast</button>
  </main>
  <script>
    const pending = new Map();
    let nextId = 1;

    window.__extosReceive = source => {
      const response = JSON.parse(source);
      const request = pending.get(response.id);
      if (!request) return;
      pending.delete(response.id);
      response.ok ? request.resolve(response.result) : request.reject(response.error);
    };

    const call = (method, params = {}) => new Promise((resolve, reject) => {
      const id = String(nextId++);
      pending.set(id, { resolve, reject });
      ExtOSNative.postMessage(JSON.stringify({ id, method, params }));
    });

    call('runtime.version')
      .then(result => document.querySelector('#runtime').textContent = `Runtime ${result.version}`)
      .catch(error => document.querySelector('#runtime').textContent = error.message);
    document.querySelector('#toast').addEventListener('click', () => {
      call('ui.toast', { message: 'Capability granted' }).catch(console.error);
    });
  </script>
</body>
</html>
